syntax = "proto3";

package message;

import "google/protobuf/timestamp.proto";

option go_package = "uniun/pkg/protobuf";

// DataBlock is the message format sent from client to server.
message DataBlock {
  string type = 1;      // e.g., "user.update", "data.stream"
  bytes payload = 2;    // The actual data payload
}

// Block is the structure we will serialize and store in the database.
message Block {
  string id = 1;
  bytes data = 2;
  google.protobuf.Timestamp timestamp = 3;
}